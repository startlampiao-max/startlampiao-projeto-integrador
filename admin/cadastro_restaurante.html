<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Cadastro de restaurante parceiro no StartLampião."
    >

    <title>
        Cadastrar Restaurante | StartLampião
    </title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/admin.css"
    >

    <link
        rel="stylesheet"
        href="../css/cadastro_restaurante.css"
    >

</head>


<body>

    <div class="layout-admin">

        <aside class="menu-lateral">

            <div class="marca-admin">

                <div class="logo-admin">
                    SL
                </div>

                <div>

                    <strong>
                        StartLampião
                    </strong>

                    <span>
                        Administração
                    </span>

                </div>

            </div>


            <nav
                class="navegacao-admin"
                aria-label="Menu administrativo"
            >

                <a
                    href="dashboard.html"
                    class="menu-link"
                >
                    Dashboard
                </a>

                <a
                    href="restaurantes.html"
                    class="menu-link ativo"
                >
                    Restaurantes
                </a>

                <a
                    href="pedidos.html"
                    class="menu-link"
                >
                    Pedidos
                </a>

                <a
                    href="clientes.html"
                    class="menu-link"
                >
                    Clientes
                </a>

                <a
                    href="entregadores.html"
                    class="menu-link"
                >
                    Entregadores
                </a>

                <a
                    href="relatorios.html"
                    class="menu-link"
                >
                    Relatórios
                </a>

                <a
                    href="configuracoes.html"
                    class="menu-link"
                >
                    Configurações
                </a>

            </nav>


            <button
                type="button"
                class="btn-sair"
                id="btnSair"
            >
                Sair
            </button>

        </aside>


        <main class="area-admin">

            <header class="topo-admin">

                <div>

                    <p class="texto-pequeno">
                        Administração
                    </p>

                    <h1>
                        Cadastrar Restaurante
                    </h1>

                </div>


                <button
                    type="button"
                    class="btn btn-secundario"
                    id="btnVoltar"
                >
                    Voltar
                </button>

            </header>


            <section class="card formulario-restaurante">

                <div class="cabecalho-formulario">

                    <h2>
                        Dados do estabelecimento
                    </h2>

                    <p>
                        Preencha os dados para cadastrar um novo restaurante parceiro.
                    </p>

                </div>


                <div
                    id="mensagem"
                    class="mensagem"
                    role="alert"
                    aria-live="polite"
                ></div>


                <form
                    id="formCadastroRestaurante"
                    novalidate
                >

                    <div class="grade-formulario">

                        <div class="form-grupo campo-duplo">

                            <label for="nome">
                                Nome do restaurante
                            </label>

                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Ex.: Sabor do Sertão"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="cnpj">
                                CNPJ
                            </label>

                            <input
                                type="text"
                                id="cnpj"
                                name="cnpj"
                                inputmode="numeric"
                                maxlength="18"
                                placeholder="00.000.000/0000-00"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="telefone">
                                Telefone
                            </label>

                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                maxlength="15"
                                placeholder="(00) 00000-0000"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="email">
                                E-mail
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="restaurante@email.com"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="responsavel">
                                Responsável
                            </label>

                            <input
                                type="text"
                                id="responsavel"
                                name="responsavel"
                                placeholder="Nome do responsável"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="categoria">
                                Categoria principal
                            </label>

                            <select
                                id="categoria"
                                name="categoria"
                                required
                            >

                                <option value="">
                                    Selecione
                                </option>

                                <option value="Comida brasileira">
                                    Comida brasileira
                                </option>

                                <option value="Lanches">
                                    Lanches
                                </option>

                                <option value="Pizzas">
                                    Pizzas
                                </option>

                                <option value="Hambúrgueres">
                                    Hambúrgueres
                                </option>

                                <option value="Doces e sobremesas">
                                    Doces e sobremesas
                                </option>

                                <option value="Outros">
                                    Outros
                                </option>

                            </select>

                        </div>


                        <div class="form-grupo">

                            <label for="cep">
                                CEP
                            </label>

                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                maxlength="9"
                                placeholder="00000-000"
                                required
                            >

                        </div>


                        <div class="form-grupo campo-duplo">

                            <label for="endereco">
                                Endereço
                            </label>

                            <input
                                type="text"
                                id="endereco"
                                name="endereco"
                                placeholder="Rua, avenida ou praça"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="numero">
                                Número
                            </label>

                            <input
                                type="text"
                                id="numero"
                                name="numero"
                                placeholder="Ex.: 120"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="bairro">
                                Bairro
                            </label>

                            <input
                                type="text"
                                id="bairro"
                                name="bairro"
                                placeholder="Nome do bairro"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="cidade">
                                Cidade
                            </label>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                placeholder="Cidade"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="estado">
                                Estado
                            </label>

                            <input
                                type="text"
                                id="estado"
                                name="estado"
                                maxlength="2"
                                placeholder="PI"
                                required
                            >

                        </div>


                        <div class="form-grupo campo-duplo">

                            <label for="descricao">
                                Descrição
                            </label>

                            <textarea
                                id="descricao"
                                name="descricao"
                                placeholder="Descrição breve do restaurante"
                            ></textarea>

                        </div>

                    </div>


                    <div class="acoes-formulario">

                        <button
                            type="button"
                            class="btn btn-secundario"
                            id="btnCancelar"
                        >
                            Cancelar
                        </button>

                        <button
                            type="submit"
                            class="btn btn-primario"
                            id="btnSalvar"
                        >
                            Salvar restaurante
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>


    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin/cadastro_restaurante.js"></script>

</body>

</html>
