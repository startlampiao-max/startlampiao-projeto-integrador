<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Cadastro do administrador do StartLampião."
    >

    <title>
        Cadastro do Administrador | StartLampião
    </title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/cadastro_administrador.css"
    >

</head>


<body>

    <main class="pagina-cadastro">

        <section class="card-cadastro">

            <div class="cabecalho-cadastro">

                <div class="logo-texto">
                    StartLampião
                </div>

                <h1>
                    Cadastro do Administrador
                </h1>

                <p>
                    Crie a conta principal de administração do sistema.
                </p>

            </div>


            <div
                id="mensagem"
                class="mensagem"
                role="alert"
                aria-live="polite"
            ></div>


            <form
                id="formCadastroAdministrador"
                novalidate
            >

                <div class="form-grupo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        placeholder="Digite seu nome completo"
                        required
                    >

                </div>


                <div class="form-grupo">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        inputmode="numeric"
                        maxlength="14"
                        placeholder="000.000.000-00"
                        required
                    >

                </div>


                <div class="form-grupo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        inputmode="tel"
                        maxlength="15"
                        placeholder="(00) 00000-0000"
                        required
                    >

                </div>


                <div class="form-grupo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="administrador@email.com"
                        required
                    >

                </div>


                <div class="form-grupo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        autocomplete="new-password"
                        minlength="6"
                        placeholder="Mínimo de 6 caracteres"
                        required
                    >

                </div>


                <div class="form-grupo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        autocomplete="new-password"
                        minlength="6"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primario btn-cadastrar"
                    id="btnCadastrar"
                >
                    Criar conta do administrador
                </button>

            </form>

        </section>

    </main>


    <!-- IMPORTANTE:
         A ORDEM DOS SCRIPTS DEVE SER MANTIDA
    -->

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cadastro_administrador.js"></script>

</body>

</html>
