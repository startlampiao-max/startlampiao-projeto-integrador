<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Validação de acesso do restaurante no StartLampião."
    >

    <title>
        Acesso do Restaurante | StartLampião
    </title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/acesso_restaurante.css"
    >

</head>


<body>

    <main class="pagina-acesso-restaurante">

        <section class="card-acesso">

            <div class="cabecalho-acesso">

                <div class="logo-texto">
                    StartLampião
                </div>

                <h1>
                    Acesso do Restaurante
                </h1>

                <p>
                    Informe o código fornecido pelo administrador.
                </p>

            </div>


            <div
                id="mensagem"
                class="mensagem"
                role="alert"
                aria-live="polite"
            ></div>


            <form
                id="formAcessoRestaurante"
                novalidate
            >

                <div class="form-grupo">

                    <label for="codigoAcesso">
                        Código de acesso
                    </label>

                    <input
                        type="text"
                        id="codigoAcesso"
                        name="codigoAcesso"
                        maxlength="20"
                        autocomplete="off"
                        placeholder="Ex.: SL-BUX-7473"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primario btn-validar"
                    id="btnValidar"
                >
                    Validar código
                </button>

            </form>


            <section
                id="dadosRestaurante"
                class="dados-restaurante oculto"
            >

                <div class="divisor"></div>

                <p class="texto-validado">
                    Restaurante identificado:
                </p>

                <h2 id="nomeRestaurante">
                    Restaurante
                </h2>

                <div class="informacoes-restaurante">

                    <div>
                        <span>E-mail</span>
                        <strong id="emailRestaurante"></strong>
                    </div>

                    <div>
                        <span>Responsável</span>
                        <strong id="responsavelRestaurante"></strong>
                    </div>

                    <div>
                        <span>Status</span>
                        <strong id="statusRestaurante"></strong>
                    </div>

                </div>


                <button
                    type="button"
                    class="btn btn-secundario btn-continuar"
                    id="btnContinuar"
                >
                    Criar conta do restaurante
                </button>

            </section>


            <div class="acoes-secundarias">

                <a
                    href="../login.html"
                    class="link-voltar"
                >
                    Voltar para o login
                </a>

            </div>

        </section>

    </main>


    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/restaurante/acesso.js"></script>

</body>

</html>
