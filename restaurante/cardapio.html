<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Cardápio | StartLampião
    </title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/cardapio_restaurante.css"
    >

</head>


<body>

    <main class="pagina-cardapio">

        <aside class="menu-lateral">

            <div class="marca-restaurante">

                <div class="icone-marca">
                    SL
                </div>

                <div>

                    <strong>
                        StartLampião
                    </strong>

                    <span>
                        Restaurante
                    </span>

                </div>

            </div>


            <nav class="menu">

                <a
                    href="dashboard.html"
                    class="item-menu"
                >
                    Dashboard
                </a>

                <a
                    href="categorias.html"
                    class="item-menu"
                >
                    Categorias
                </a>

                <a
                    href="cardapio.html"
                    class="item-menu ativo"
                >
                    Cardápio
                </a>

                <span class="item-menu desabilitado">
                    Pedidos
                </span>

                <span class="item-menu desabilitado">
                    Entregas
                </span>

                <span class="item-menu desabilitado">
                    Fidelidade
                </span>

            </nav>


            <button
                type="button"
                class="btn-sair"
                id="btnSair"
            >
                Sair
            </button>

        </aside>


        <section class="conteudo">

            <header class="topo">

                <div>

                    <p class="subtitulo">
                        Área do Restaurante
                    </p>

                    <h1>
                        Cardápio
                    </h1>

                    <p
                        id="nomeRestaurante"
                        class="nome-restaurante"
                    >
                        Carregando restaurante...
                    </p>

                </div>


                <a
                    href="dashboard.html"
                    class="btn btn-secundario"
                >
                    Voltar ao Dashboard
                </a>

            </header>


            <div
                id="mensagem"
                class="mensagem"
                role="alert"
                aria-live="polite"
            ></div>


            <div class="grade-cardapio">

                <section class="card formulario-card">

                    <h2>
                        Novo produto
                    </h2>

                    <p class="texto-apoio">
                        Cadastre os pratos e produtos do restaurante.
                    </p>


                    <form
                        id="formProduto"
                        novalidate
                    >

                        <div class="form-grupo">

                            <label for="categoriaProduto">
                                Categoria
                            </label>

                            <select
                                id="categoriaProduto"
                                required
                            >

                                <option value="">
                                    Selecione uma categoria
                                </option>

                            </select>

                        </div>


                        <div class="form-grupo">

                            <label for="nomeProduto">
                                Nome do produto
                            </label>

                            <input
                                type="text"
                                id="nomeProduto"
                                maxlength="80"
                                placeholder="Ex.: Baião de Dois"
                                required
                            >

                        </div>


                        <div class="form-grupo">

                            <label for="descricaoProduto">
                                Descrição
                            </label>

                            <textarea
                                id="descricaoProduto"
                                maxlength="250"
                                placeholder="Ex.: Baião de dois acompanhado de carne de sol."
                            ></textarea>

                        </div>


                        <div class="form-grupo">

                            <label for="precoProduto">
                                Preço
                            </label>

                            <input
                                type="number"
                                id="precoProduto"
                                min="0"
                                step="0.01"
                                placeholder="Ex.: 25.00"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primario btn-cadastrar"
                            id="btnCadastrar"
                        >
                            Cadastrar produto
                        </button>

                    </form>

                </section>


                <section class="card lista-card">

                    <div class="cabecalho-lista">

                        <div>

                            <h2>
                                Produtos cadastrados
                            </h2>

                            <p>
                                Total:
                                <strong id="totalProdutos">
                                    0
                                </strong>
                            </p>

                        </div>

                    </div>


                    <div
                        id="listaProdutos"
                        class="lista-produtos"
                    >

                        <p class="estado-vazio">
                            Nenhum produto cadastrado ainda.
                        </p>

                    </div>

                </section>

            </div>

        </section>

    </main>


    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/restaurante/cardapio.js"></script>

</body>

</html>
