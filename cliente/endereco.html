<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Endereço de entrega do cliente no StartLampião."
    >

    <title>
        Endereço de Entrega | StartLampião
    </title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/endereco_cliente.css"
    >

</head>


<body>

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="cabecalho-cliente">

        <div class="container cabecalho-conteudo">

            <a
                href="restaurantes.html"
                class="marca-cliente"
            >

                <div class="icone-marca">
                    SL
                </div>

                <div>

                    <strong>
                        StartLampião
                    </strong>

                    <span>
                        Delivery
                    </span>

                </div>

            </a>


            <div class="acoes-cabecalho">

                <a
                    href="restaurantes.html"
                    class="btn btn-secundario"
                >
                    Restaurantes
                </a>

                <a
                    href="carrinho.html"
                    class="btn btn-secundario"
                >
                    Carrinho
                </a>

            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO
         ===================================================== -->

    <main>

        <section class="hero-endereco">

            <div class="container">

                <p class="subtitulo">
                    Entrega
                </p>

                <h1>
                    Endereço de entrega
                </h1>

                <p class="texto-apoio">
                    Informe onde o pedido deverá ser entregue.
                </p>

            </div>

        </section>


        <section class="secao-endereco">

            <div class="container">

                <div
                    id="mensagem"
                    class="mensagem"
                    role="alert"
                    aria-live="polite"
                ></div>


                <div class="grade-endereco">

                    <!-- =====================================
                         FORMULÁRIO
                         ===================================== -->

                    <section class="card endereco-card">

                        <div class="cabecalho-secao">

                            <div>

                                <h2>
                                    Dados do endereço
                                </h2>

                                <p>
                                    Preencha os campos para continuar.
                                </p>

                            </div>

                        </div>


                        <form
                            id="formEndereco"
                            class="formulario-endereco"
                            novalidate
                        >

                            <!-- CEP -->

                            <div class="campo">

                                <label for="cep">
                                    CEP
                                </label>

                                <input
                                    type="text"
                                    id="cep"
                                    name="cep"
                                    placeholder="00000-000"
                                    maxlength="9"
                                    inputmode="numeric"
                                    required
                                >

                            </div>


                            <!-- ESTADO -->

                            <div class="campo">

                                <label for="estado">
                                    Estado
                                </label>

                                <input
                                    type="text"
                                    id="estado"
                                    name="estado"
                                    placeholder="PI"
                                    maxlength="2"
                                    required
                                >

                            </div>


                            <!-- CIDADE -->

                            <div class="campo campo-completo">

                                <label for="cidade">
                                    Cidade
                                </label>

                                <input
                                    type="text"
                                    id="cidade"
                                    name="cidade"
                                    placeholder="Digite a cidade"
                                    required
                                >

                            </div>


                            <!-- BAIRRO -->

                            <div class="campo campo-completo">

                                <label for="bairro">
                                    Bairro
                                </label>

                                <input
                                    type="text"
                                    id="bairro"
                                    name="bairro"
                                    placeholder="Digite o bairro"
                                    required
                                >

                            </div>


                            <!-- RUA -->

                            <div class="campo campo-completo">

                                <label for="logradouro">
                                    Rua / Avenida
                                </label>

                                <input
                                    type="text"
                                    id="logradouro"
                                    name="logradouro"
                                    placeholder="Digite a rua ou avenida"
                                    required
                                >

                            </div>


                            <!-- NÚMERO -->

                            <div class="campo">

                                <label for="numero">
                                    Número
                                </label>

                                <input
                                    type="text"
                                    id="numero"
                                    name="numero"
                                    placeholder="Ex.: 100"
                                    required
                                >

                            </div>


                            <!-- COMPLEMENTO -->

                            <div class="campo">

                                <label for="complemento">
                                    Complemento
                                </label>

                                <input
                                    type="text"
                                    id="complemento"
                                    name="complemento"
                                    placeholder="Casa, apto, referência..."
                                >

                            </div>


                            <!-- REFERÊNCIA -->

                            <div class="campo campo-completo">

                                <label for="referencia">
                                    Ponto de referência
                                </label>

                                <input
                                    type="text"
                                    id="referencia"
                                    name="referencia"
                                    placeholder="Ex.: próximo à praça"
                                >

                            </div>


                            <!-- AÇÕES -->

                            <div class="acoes-formulario">

                                <button
                                    type="submit"
                                    class="btn btn-primario btn-continuar"
                                    id="btnContinuar"
                                >
                                    Continuar para pagamento
                                </button>


                                <a
                                    href="resumo_pedido.html"
                                    class="btn btn-secundario btn-voltar"
                                >
                                    Voltar ao resumo
                                </a>

                            </div>

                        </form>

                    </section>


                    <!-- =====================================
                         RESUMO LATERAL
                         ===================================== -->

                    <aside class="card resumo-entrega">

                        <h2>
                            Seu pedido
                        </h2>


                        <p class="resumo-texto">
                            Restaurante
                        </p>

                        <strong id="nomeRestaurante">
                            Carregando...
                        </strong>


                        <div class="linha-resumo">

                            <span>
                                Itens
                            </span>

                            <strong id="totalItens">
                                0
                            </strong>

                        </div>


                        <div class="linha-resumo total">

                            <span>
                                Total
                            </span>

                            <strong id="totalPedido">
                                R$ 0,00
                            </strong>

                        </div>

                    </aside>

                </div>

            </div>

        </section>

    </main>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer class="rodape">

        <div class="container">

            <p>
                StartLampião — Sabor que te conecta.
            </p>

        </div>

    </footer>


    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cliente/endereco.js"></script>

</body>

</html>
