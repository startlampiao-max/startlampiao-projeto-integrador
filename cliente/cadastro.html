<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Cadastro de cliente do StartLampião."
    >

    <title>
        Cadastro de Cliente | StartLampião
    </title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/cadastro_cliente.css"
    >

</head>


<body>

    <main class="pagina-cadastro">

        <section class="card-cadastro">

            <!-- =============================================
                 IDENTIDADE
                 ============================================= -->

            <div class="marca-cadastro">

                <div class="icone-marca">
                    SL
                </div>

                <div>

                    <strong>
                        StartLampião
                    </strong>

                    <span>
                        Delivery
                    </span>

                </div>

            </div>


            <div class="cabecalho-cadastro">

                <p class="subtitulo">
                    Cliente
                </p>

                <h1>
                    Criar sua conta
                </h1>

                <p>
                    Preencha seus dados para comprar
                    no StartLampião.
                </p>

            </div>


            <!-- =============================================
                 MENSAGEM
                 ============================================= -->

            <div
                id="mensagem"
                class="mensagem"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- =============================================
                 FORMULÁRIO
                 ============================================= -->

            <form
                id="formCadastroCliente"
                class="formulario"
                novalidate
            >

                <!-- NOME -->

                <div class="campo campo-completo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- CPF -->

                <div class="campo">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        inputmode="numeric"
                        maxlength="14"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- TELEFONE -->

                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                        maxlength="15"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- E-MAIL -->

                <div class="campo campo-completo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        autocomplete="new-password"
                        required
                    >

                    <small>
                        Use pelo menos 6 caracteres.
                    </small>

                </div>


                <!-- CONFIRMAR SENHA -->

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- BOTÃO -->

                <div class="acoes-formulario">

                    <button
                        type="submit"
                        class="btn btn-primario btn-cadastrar"
                        id="btnCadastrar"
                    >
                        Criar conta
                    </button>


                    <a
                        href="../login.html"
                        class="btn btn-secundario btn-voltar"
                    >
                        Voltar para o login
                    </a>

                </div>

            </form>

        </section>

    </main>


    <!-- =====================================================
         SCRIPTS
         ===================================================== -->

    <script src="../js/storage.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/cliente/cadastro.js"></script>

</body>

</html>
